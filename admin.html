<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login – Balding Barbie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #faf0f5;
            --text: #4a3a4a;
            --muted: #8a7a8a;
            --primary: #ff69b4;
            --primary-dim: rgba(255, 105, 180, 0.15);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 182, 193, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(184, 169, 212, 0.12) 0%, transparent 50%);
        }
        .container {
            max-width: 400px;
            width: 100%;
            padding: 2.5rem 2rem;
            background: rgba(255, 245, 250, 0.75);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.08);
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4a3a4a, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }
        .logo span {
            font-size: 0.8rem;
            color: var(--muted);
            display: block;
            -webkit-text-fill-color: var(--muted);
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.3rem;
        }
        input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 1.2rem;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-dim);
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #ff69b4, #d68bb8);
            color: #fff;
            border: none;
            border-radius: 99px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 24px rgba(255, 105, 180, 0.2);
        }
        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 40px rgba(255, 105, 180, 0.3);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .error {
            display: none;
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(255, 0, 0, 0.05);
            border: 1px solid rgba(255, 0, 0, 0.15);
            border-radius: 12px;
            color: #c0392b;
            font-size: 0.85rem;
            text-align: center;
        }
        .error.show {
            display: block;
        }
        .footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            opacity: 0.4;
        }
        .footer a {
            color: #ff69b4;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .hint {
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            opacity: 0.3;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🩷 BALDING BARBIE</h1>
            <span>admin panel</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="enter your best guess" />

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" />

            <button type="submit" class="btn">Sign In</button>

            <div id="error" class="error">
                ⚠️ Nice try, Swiftie. Go back to streaming.
            </div>
        </form>

        <div class="hint">hint: it's not "taylor" or "1989"</div>

        <div class="footer">
            <a href="/" target="_blank">back to the receipts</a> · 
            <a href="https://jeffbranches.com" target="_blank" rel="noopener noreferrer">made by jeff branches</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const error = document.getElementById('error');
            error.classList.add('show');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
