<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Balding Barbie — Spin the Wheel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" integrity="sha512-+4zCK9k+qNFUR5X+cKL9EIR+ZOhtIloNl9GIKS57V1MyNsYpYcUrUeQc9vNfzsWfV28IaLL3i96P9sdNyeRssA==" crossorigin="anonymous" />
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        background: transparent;
        overflow: hidden;
    }
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0.5rem 0.5rem 0.25rem;
    }

    .wheel-question {
        font-size: 0.9rem;
        font-weight: 600;
        color: #666;
        margin-bottom: 0.75rem;
        text-align: center;
    }

    /* ===== WRAPPER ===== */
    #wrapper {
        margin: 0 auto;
        width: 296px;
        position: relative;
    }

    /* ===== WHEEL ===== */
    #wheel {
        width: 280px;
        height: 280px;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
        border: 8px solid #fff;
        box-shadow: rgba(0,0,0,0.15) 0px 0px 10px, rgba(0,0,0,0.04) 0px 3px 0px;
        transform: rotate(0deg);
        background: #fff;
    }

    #wheel:before {
        content: '';
        position: absolute;
        border: 4px solid rgba(0,0,0,0.08);
        width: 272px;
        height: 272px;
        border-radius: 50%;
        z-index: 1000;
        pointer-events: none;
        top: -4px;
        left: -4px;
        box-sizing: border-box;
    }

    #inner-wheel {
        width: 100%;
        height: 100%;
        position: relative;
        transition: all 3.5s cubic-bezier(0,.99,.44,.99);
    }

    /* ===== WEDGES (CSS triangles like OG) ===== */
    #wheel div.sec {
        position: absolute;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 145px 84px 0;
        border-color: #ff69b4 transparent;
        transform-origin: 84px 144px;
        left: 56px;
        top: -4px;
    }

    #wheel div.sec:nth-child(1) {
        transform: rotate(60deg);
        border-color: #ff69b4 transparent;
    }
    #wheel div.sec:nth-child(2) {
        transform: rotate(120deg);
        border-color: #d97eb5 transparent;
    }
    #wheel div.sec:nth-child(3) {
        transform: rotate(180deg);
        border-color: #b8a9d4 transparent;
    }
    #wheel div.sec:nth-child(4) {
        transform: rotate(240deg);
        border-color: #8fa4d4 transparent;
    }
    #wheel div.sec:nth-child(5) {
        transform: rotate(300deg);
        border-color: #d4a9c4 transparent;
    }
    #wheel div.sec:nth-child(6) {
        transform: rotate(360deg);
        border-color: #a68fd4 transparent;
    }

    /* ===== ICONS INSIDE WEDGES ===== */
    #wheel div.sec .fa {
        margin-top: -112px;
        color: rgba(255, 255, 255, 0.85);
        position: relative;
        z-index: 100;
        display: block;
        text-align: center;
        font-size: 28px;
        margin-left: -14px;
        text-shadow: rgba(255,255,255,0.1) 0px -1px 0px, rgba(0,0,0,0.2) 0px 1px 0px;
        pointer-events: none;
    }

    /* ===== CENTER SPIN BUTTON ===== */
    #spin {
        width: 68px;
        height: 68px;
        position: absolute;
        top: 50%;
        left: 50%;
        margin: -34px 0 0 -34px;
        border-radius: 50%;
        box-shadow: rgba(0,0,0,0.1) 0px 3px 0px;
        z-index: 1000;
        background: #ff69b4;
        cursor: pointer;
        font-family: inherit;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    #spin:after {
        content: "SPIN";
        text-align: center;
        line-height: 68px;
        color: #fff;
        text-shadow: 0 1px 0 rgba(0,0,0,0.2);
        position: relative;
        z-index: 100;
        width: 68px;
        height: 68px;
        display: block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    #spin:before {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 0 14px 20px 14px;
        border-color: transparent transparent #ff69b4 transparent;
        top: -14px;
        left: 20px;
    }

    #inner-spin {
        width: 54px;
        height: 54px;
        position: absolute;
        top: 50%;
        left: 50%;
        margin: -27px 0 0 -27px;
        border-radius: 50%;
        z-index: 99;
        box-shadow: rgba(255,255,255,1) 0px -2px 0px inset, rgba(255,255,255,1) 0px 2px 0px inset, rgba(0,0,0,0.15) 0px 0px 5px;
        background: radial-gradient(ellipse at center, rgba(255,255,255,1) 0%, rgba(255,182,213,1) 100%);
    }

    #spin:active #inner-spin {
        box-shadow: rgba(0,0,0,0.3) 0px 0px 5px inset;
    }

    #spin:active:after {
        font-size: 12px;
    }

    /* ===== SHINE OVERLAY (3D glass effect) ===== */
    #shine {
        width: 280px;
        height: 280px;
        position: absolute;
        top: 0;
        left: 0;
        background: radial-gradient(
            ellipse at center,
            rgba(255,255,255,1) 0%,
            rgba(255,255,255,0.99) 1%,
            rgba(255,255,255,0.91) 9%,
            rgba(255,255,255,0) 100%
        );
        opacity: 0.12;
        pointer-events: none;
        border-radius: 50%;
    }

    /* ===== WOBBLE ANIMATION ===== */
    @keyframes hh {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(7deg); }
    }
    .spin {
        animation: hh 0.1s;
    }

    /* ===== RESULT DISPLAY ===== */
    #winnings {
        margin-top: 1rem;
        min-height: 3rem;
        max-width: 320px;
        text-align: center;
        font-size: 0.9rem;
        line-height: 1.4;
        opacity: 0;
        transition: opacity 0.3s ease;
        padding: 0 0.5rem;
    }
    #winnings.show {
        opacity: 1;
    }
    #winnings .result-text {
        font-weight: 700;
        color: #1a1a1a;
        display: block;
    }
    #winnings .result-source {
        display: block;
        margin-top: 0.25rem;
        font-size: 0.65rem;
        color: #999;
        font-style: italic;
        font-weight: 400;
    }

    @media (max-width: 480px) {
        #wrapper, #wheel, #shine {
            width: 240px;
            height: 240px;
        }
        #wheel div.sec {
            border-width: 124px 72px 0;
            transform-origin: 72px 124px;
            left: 48px;
            top: -4px;
        }
        #wheel div.sec .fa {
            margin-top: -96px;
            font-size: 24px;
            margin-left: -12px;
        }
        #wheel:before {
            width: 232px;
            height: 232px;
        }
        #spin {
            width: 60px;
            height: 60px;
            margin: -30px 0 0 -30px;
        }
        #spin:after {
            line-height: 60px;
            width: 60px;
            height: 60px;
            font-size: 12px;
        }
        #inner-spin {
            width: 46px;
            height: 46px;
            margin: -23px 0 0 -23px;
        }
    }
</style>
</head>
<body>

    <div class="wheel-question">What should Taylor do today? 🎰</div>

    <div id="wrapper">
        <div id="wheel">
            <div id="inner-wheel">
                <div class="sec"><span class="fa fa-hand-holding-dollar"></span></div>
                <div class="sec"><span class="fa fa-ban"></span></div>
                <div class="sec"><span class="fa fa-record-vinyl"></span></div>
                <div class="sec"><span class="fa fa-guitar"></span></div>
                <div class="sec"><span class="fa fa-plane-departure"></span></div>
                <div class="sec"><span class="fa fa-volume-mute"></span></div>
            </div>
            <div id="spin">
                <div id="inner-spin"></div>
            </div>
            <div id="shine"></div>
        </div>

        <div id="winnings"></div>
    </div>

<script>
(function() {
    const SEGMENTS = [
        { text: 'Donate to Turning Point USA', source: '— reported by literally no one' },
        { text: 'Block another female artist from #1', source: '— for the 100th time!' },
        { text: 'Release 24 vinyl variants', source: '— chart manipulation speedrun' },
        { text: 'Steal credits from Olivia Rodrigo', source: '— millions in royalties, gone!' },
        { text: 'Take a 4-minute jet flight', source: '— 138 tons of CO₂ won\'t emit itself' },
        { text: 'Stay silent on ICE', source: '— while everyone else speaks up!' }
    ];

    const SEGMENT_ANGLE = 360 / SEGMENTS.length;
    const SPIN_DURATION = 3500; // matches CSS transition
    const BASE_DEGREE = 1800; // 5 full spins

    const innerWheel = document.getElementById('inner-wheel');
    const spinBtn = document.getElementById('spin');
    const winnings = document.getElementById('winnings');

    let clicks = 0;
    let isSpinning = false;

    // Sound of the "tick" wobble — check if wedge passes indicator
    function wobbleCheck(deg) {
        // Wedge boundaries every 60deg. If the wheel rotation mod 60 is near 0, we're at an edge.
        const mod = ((deg % 60) + 60) % 60;
        if (mod < 2 || mod > 58) {
            spinBtn.classList.add('spin');
            setTimeout(() => spinBtn.classList.remove('spin'), 100);
        }
    }

    spinBtn.addEventListener('click', function() {
        if (isSpinning) return;
        isSpinning = true;

        clicks++;

        // Pick random wedge (0-5)
        const winningIndex = Math.floor(Math.random() * SEGMENTS.length);

        // Wedge center angle: 30, 90, 150, 210, 270, 330
        const wedgeCenterAngle = winningIndex * SEGMENT_ANGLE + SEGMENT_ANGLE / 2;

        // To land wedge center under the top pointer (0deg), rotate by -(wedgeCenterAngle)
        const targetAngle = -wedgeCenterAngle;

        // Total rotation: base spins + target
        const totalDegree = BASE_DEGREE * clicks + targetAngle;

        // Apply rotation
        innerWheel.style.transform = `rotate(${totalDegree}deg)`;

        // Wobble check interval during spin
        const startTime = performance.now();
        const wobbleInterval = setInterval(() => {
            const elapsed = performance.now() - startTime;
            if (elapsed >= SPIN_DURATION) {
                clearInterval(wobbleInterval);
                return;
            }
            const progress = elapsed / SPIN_DURATION;
            const currentDeg = totalDegree * progress;
            wobbleCheck(currentDeg);
        }, 30);

        // After spin, show result
        setTimeout(function() {
            const win = SEGMENTS[winningIndex];
            winnings.innerHTML = `
                <span class="result-text">${win.text}</span>
                <span class="result-source">${win.source}</span>
            `;
            winnings.classList.add('show');
            isSpinning = false;
            reportHeight();
        }, SPIN_DURATION + 100);
    });

    // ===== REPORT HEIGHT TO PARENT IFRAME =====
    function reportHeight() {
        const height = document.body.scrollHeight;
        try {
            window.parent.postMessage({ type: 'wheelHeight', height: height }, '*');
        } catch (e) {}
    }
    window.addEventListener('load', () => {
        reportHeight();
        setTimeout(reportHeight, 200);
        setTimeout(reportHeight, 600);
    });
    window.addEventListener('resize', reportHeight);
})();
</script>

</body>
</html>
