<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Balding Barbie — Spin the Wheel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" crossorigin="anonymous" />
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        background: transparent;
        overflow: hidden;
    }
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0.5rem 0.5rem 0.5rem;
    }

    .wheel-question {
        font-size: 0.95rem;
        font-weight: 700;
        color: #444;
        margin-bottom: 0.75rem;
        text-align: center;
    }

    /* ===== WRAPPER ===== */
    #wrapper {
        margin: 0 auto;
        width: 296px;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* ===== WHEEL ===== */
    #wheel {
        width: 280px;
        height: 280px;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
        border: 8px solid #fff;
        box-shadow: rgba(0,0,0,0.15) 0px 0px 10px, rgba(0,0,0,0.04) 0px 3px 0px;
        transform: rotate(0deg);
        background: #fff;
    }

    #wheel:before {
        content: '';
        position: absolute;
        border: 4px solid rgba(0,0,0,0.08);
        width: 272px;
        height: 272px;
        border-radius: 50%;
        z-index: 1000;
        pointer-events: none;
        top: -4px;
        left: -4px;
        box-sizing: border-box;
    }

    #inner-wheel {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 3.5s cubic-bezier(0, .99, .44, .99);
    }

    /* ===== WEDGES ===== */
    #wheel div.sec {
        position: absolute;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 140px 81px 0;
        border-color: #ff69b4 transparent;
        transform-origin: 81px 140px;
        left: 59px;
        top: 0px;
    }

    #wheel div.sec:nth-child(1) { transform: rotate(0deg); border-color: #ff69b4 transparent; }
    #wheel div.sec:nth-child(2) { transform: rotate(60deg); border-color: #d97eb5 transparent; }
    #wheel div.sec:nth-child(3) { transform: rotate(120deg); border-color: #b8a9d4 transparent; }
    #wheel div.sec:nth-child(4) { transform: rotate(180deg); border-color: #8fa4d4 transparent; }
    #wheel div.sec:nth-child(5) { transform: rotate(240deg); border-color: #d4a9c4 transparent; }
    #wheel div.sec:nth-child(6) { transform: rotate(300deg); border-color: #a68fd4 transparent; }

    /* ===== ICONS INSIDE WEDGES ===== */
    #wheel div.sec .fa {
        margin-top: -115px;
        color: rgba(255, 255, 255, 0.95);
        position: relative;
        z-index: 100;
        display: block;
        text-align: center;
        font-size: 24px;
        margin-left: -12px;
        text-shadow: rgba(0,0,0,0.2) 0px 1px 2px;
        pointer-events: none;
    }

    /* ===== CENTER SPIN BUTTON ===== */
    #spin {
        width: 68px;
        height: 68px;
        position: absolute;
        top: 50%;
        left: 50%;
        margin: -34px 0 0 -34px;
        border-radius: 50%;
        box-shadow: rgba(0,0,0,0.1) 0px 3px 0px;
        z-index: 1000;
        background: #ff69b4;
        cursor: pointer;
        font-family: inherit;
        user-select: none;
    }

    #spin:after {
        content: "SPIN";
        text-align: center;
        line-height: 68px;
        color: #fff;
        text-shadow: 0 1px 0 rgba(0,0,0,0.2);
        position: relative;
        z-index: 100;
        width: 68px;
        height: 68px;
        display: block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    #spin:before {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 0 14px 20px 14px;
        border-color: transparent transparent #ff69b4 transparent;
        top: -14px;
        left: 20px;
    }

    #inner-spin {
        width: 54px;
        height: 54px;
        position: absolute;
        top: 50%;
        left: 50%;
        margin: -27px 0 0 -27px;
        border-radius: 50%;
        z-index: 99;
        box-shadow: rgba(255,255,255,1) 0px -2px 0px inset, rgba(255,255,255,1) 0px 2px 0px inset, rgba(0,0,0,0.15) 0px 0px 5px;
        background: radial-gradient(ellipse at center, rgba(255,255,255,1) 0%, rgba(255,182,213,1) 100%);
    }

    /* ===== RESULT BANNER ===== */
    #winnings {
        margin-top: 1rem;
        width: 100%;
        max-width: 280px;
        min-height: 60px;
        text-align: center;
        background: #ffffff;
        border: 2px solid #ff69b4;
        border-radius: 12px;
        padding: 0.75rem 0.5rem;
        box-shadow: 0 4px 12px rgba(255, 105, 180, 0.15);
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.4s ease, transform 0.4s ease;
        visibility: hidden;
    }

    #winnings.show {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
    }

    #winnings .result-text {
        font-weight: 700;
        color: #1a1a1a;
        font-size: 0.9rem;
        display: block;
    }

    #winnings .result-source {
        display: block;
        margin-top: 0.25rem;
        font-size: 0.75rem;
        color: #777;
        font-style: italic;
    }

    @media (max-width: 480px) {
        #wrapper, #wheel {
            width: 240px;
            height: 240px;
        }
        #wheel div.sec {
            border-width: 120px 69px 0;
            transform-origin: 69px 120px;
            left: 51px;
        }
        #wheel div.sec .fa {
            margin-top: -98px;
            font-size: 20px;
            margin-left: -10px;
        }
        #wheel:before {
            width: 232px;
            height: 232px;
        }
        #spin {
            width: 60px;
            height: 60px;
            margin: -30px 0 0 -30px;
        }
        #spin:after {
            line-height: 60px;
            width: 60px;
            height: 60px;
            font-size: 12px;
        }
        #inner-spin {
            width: 46px;
            height: 46px;
            margin: -23px 0 0 -23px;
        }
    }
</style>
</head>
<body>

    <div class="wheel-question">What should Taylor do today? 🎰</div>

    <div id="wrapper">
        <div id="wheel">
            <div id="inner-wheel">
                <div class="sec"><span class="fa fa-hand-holding-usd"></span></div>
                <div class="sec"><span class="fa fa-ban"></span></div>
                <div class="sec"><span class="fa fa-compact-disc"></span></div>
                <div class="sec"><span class="fa fa-guitar"></span></div>
                <div class="sec"><span class="fa fa-plane-departure"></span></div>
                <div class="sec"><span class="fa fa-volume-mute"></span></div>
            </div>
            <div id="spin">
                <div id="inner-spin"></div>
            </div>
        </div>

        <!-- Result Banner -->
        <div id="winnings"></div>
    </div>

<script>
(function() {
    const SEGMENTS = [
        { text: 'Donate to Turning Point USA', source: '— reported by literally no one' },
        { text: 'Block another female artist from #1', source: '— for the 100th time!' },
        { text: 'Release 24 vinyl variants', source: '— chart manipulation speedrun' },
        { text: 'Steal credits from Olivia Rodrigo', source: '— millions in royalties, gone!' },
        { text: 'Take a 4-minute jet flight', source: '— 138 tons of CO₂ won\'t emit itself' },
        { text: 'Stay silent on ICE', source: '— while everyone else speaks up!' }
    ];

    const SEGMENT_ANGLE = 360 / SEGMENTS.length;
    const SPIN_DURATION = 3500;
    const BASE_DEGREE = 1800;

    const innerWheel = document.getElementById('inner-wheel');
    const spinBtn = document.getElementById('spin');
    const winnings = document.getElementById('winnings');

    let clicks = 0;
    let isSpinning = false;

    // Safe wrapper to prevent extension errors from throwing uncaught promises
    function safePostMessage(msg) {
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(msg, '*');
            }
        } catch (e) {
            // Silence extension cross-origin postMessage errors
        }
    }

    spinBtn.addEventListener('click', function() {
        if (isSpinning) return;
        isSpinning = true;

        clicks++;
        winnings.classList.remove('show');

        // Random segment selection (0 to 5)
        const winningIndex = Math.floor(Math.random() * SEGMENTS.length);

        // Calculate rotation target
        const wedgeCenterAngle = winningIndex * SEGMENT_ANGLE + (SEGMENT_ANGLE / 2);
        const targetAngle = 360 - wedgeCenterAngle;
        const totalDegree = (BASE_DEGREE * clicks) + targetAngle;

        innerWheel.style.transform = `rotate(${totalDegree}deg)`;

        // Show banner after rotation ends
        setTimeout(function() {
            const win = SEGMENTS[winningIndex];
            winnings.innerHTML = `
                <span class="result-text">${win.text}</span>
                <span class="result-source">${win.source}</span>
            `;
            winnings.classList.add('show');
            isSpinning = false;
            reportHeight();
        }, SPIN_DURATION + 100);
    });

    function reportHeight() {
        const height = document.body.scrollHeight;
        safePostMessage({ type: 'wheelHeight', height: height });
    }

    window.addEventListener('load', () => {
        reportHeight();
        setTimeout(reportHeight, 300);
    });
    window.addEventListener('resize', reportHeight);
})();
</script>

</body>
</html>
