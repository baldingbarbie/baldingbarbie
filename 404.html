<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />

    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="baldingbaddie" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f8f6f4;
            --text: #1a1a1a;
            --muted: #666;
            --primary: #ff69b4;
            --primary-dim: rgba(255, 105, 180, 0.1);
            --radius: 16px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
            background: #ffffff;
            border-radius: var(--radius);
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: 0 2px 32px rgba(0,0,0,0.04);
        }
        .container img {
            width: 100%;
            max-width: 300px;
            height: auto;
            margin-bottom: 1.5rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .container h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }
        .container h1 span {
            background: linear-gradient(135deg, #ff69b4, #b8a9d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container p {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }
        .container .btn {
            display: inline-block;
            background: var(--text);
            color: #fff;
            padding: 0.7rem 2.5rem;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .container .btn:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .container .small {
            margin-top: 1.5rem;
            font-size: 0.6rem;
            color: var(--muted);
            opacity: 0.2;
            letter-spacing: 0.5px;
        }
        .container .small a {
            color: var(--muted);
            text-decoration: none;
        }
        .container .small a:hover {
            text-decoration: underline;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/assets/404.webp" alt="404" />
        <h1>nice try, <span>swiftie</span></h1>
        <p>This page doesn't exist. Taylor probably stole it.</p>
        <a href="/" class="btn">back to the receipts</a>
        <div class="small">
            <a href="https://jeffbranches.com" target="_blank" rel="noopener noreferrer">made by jeff branches</a>
        </div>
    </div>
</body>
</html>
