<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 – Balding Barbie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #faf0f5;
            --text: #4a3a4a;
            --muted: #8a7a8a;
            --primary: #ff69b4;
            --primary-dim: rgba(255, 105, 180, 0.15);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 182, 193, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(184, 169, 212, 0.12) 0%, transparent 50%);
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 3rem 2rem;
            background: rgba(255, 245, 250, 0.75);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.08);
        }
        .emoji {
            font-size: 5rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4a3a4a, #ff69b4, #b8a9d4);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 6s ease-in-out infinite;
            letter-spacing: -1px;
        }
        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        p {
            color: var(--muted);
            margin: 1rem 0 2rem 0;
            font-size: 1.1rem;
            line-height: 1.7;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff69b4, #d68bb8);
            color: #fff;
            padding: 0.75rem 2.5rem;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 24px rgba(255, 105, 180, 0.25);
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 40px rgba(255, 105, 180, 0.3);
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: var(--muted);
            opacity: 0.4;
        }
        .footer a {
            color: #ff69b4;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="emoji">🖕</span>
        <h1>404</h1>
        <p>You've found a page that doesn't exist.<br />Probably Taylor's PR team trying to scrub this.</p>
        <a href="/" class="btn">Go back to the receipts</a>
        <div class="footer">
            <a href="https://jeffbranches.com" target="_blank" rel="noopener noreferrer">made by jeff branches</a>
        </div>
    </div>
</body>
</html>
